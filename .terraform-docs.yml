  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

  ## Security Considerations

  - All sensitive configuration is stored in AWS Systems Manager Parameter Store with encryption
  - KMS keys are used for additional encryption layers
  - IAM roles follow the principle of least privilege
  - CloudWatch logging is enabled for audit trails

