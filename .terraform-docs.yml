formatter: "markdown table"

version: ""

header-from: main.tf
footer-from: ""

recursive:
  enabled: false
  path: modules

sections:
  hide: []
  show: []

content: |-
  {{ .Header }}

  ## Usage

  ```hcl
  module "lambda_edge_auth" {
    source = "github.com/shashax42/terraform-aws-lambda-at-edge-cognito-authentication"

    name                = "my-app"
    cognito_user_pool   = "us-east-1_XXXXXXXXX"
    cognito_client_id   = "xxxxxxxxxxxxxxxxxxxxxxxxxx"
    
    # Optional: Enhanced monitoring
    enable_enhanced_monitoring = true
    alarm_notification_emails  = ["admin@example.com"]
    
    tags = {
      Environment = "production"
      Project     = "my-project"
    }
  }
  ```

  ## Features

  - **Lambda@Edge Authentication**: Seamless Cognito authentication at CloudFront edge locations
  - **Multiple Configuration Modes**: Dynamic, hybrid, and static configuration options
  - **Enhanced Security**: Built-in security best practices and monitoring
  - **Comprehensive Monitoring**: CloudWatch dashboards, alarms, and log analysis
  - **Cost Optimization**: Efficient caching and minimal cold starts

  ## Architecture

  This module creates a Lambda@Edge function that intercepts CloudFront requests and validates authentication through AWS Cognito User Pools. The function runs at edge locations for optimal performance.

  {{ .Requirements }}

  {{ .Providers }}

